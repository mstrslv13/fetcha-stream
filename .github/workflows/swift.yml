# Builds the macOS app with Xcode.
# This repository is an Xcode project (yt-dlp-MAX.xcodeproj), not a Swift package,
# so Swift Package Manager commands (swift build / swift test) cannot build it.
# The project's test targets currently contain no test sources, so there is no test step.

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Show Xcode version
      run: xcodebuild -version
    - name: Build app (unsigned)
      run: >
        xcodebuild
        -project yt-dlp-MAX.xcodeproj
        -target yt-dlp-MAX
        -configuration Debug
        CODE_SIGNING_ALLOWED=NO
        build
